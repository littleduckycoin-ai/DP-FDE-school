name: 在线学习记录
description: 在这里留下案例的思考、评价、问题或修订。
title: "[学习记录] "
labels: [school-reflection]
body:
  - type: markdown
    attributes:
      value: "同一学员、同一案例已有主题时，请继续在原主题追加评论。这里是公开学习记录。"
  - type: dropdown
    id: case
    attributes:
      label: 案例
      options:
        - case-01-manufacturing-training
        - case-02-vehicle-registration
        - case-03-legal-case-workspace
        - case-04-urban-planning-tools
        - case-05-creator-operations
        - case-06-truck-loading
        - case-07-team-ai-collaboration
        - case-08-industrial-parts-search
        - case-09-research-finance
        - case-10-retail-reconciliation
        - case-11-customer-side-development
        - case-12-ecommerce-content-assets
        - case-13-fire-maintenance
        - case-14-organizational-adoption
        - case-15-local-business-copywriting
        - case-16-telecom-analysis
        - case-17-manufacturing-quotation
        - case-18-sales-enablement
        - case-19-packaging-review
        - case-20-supply-chain-visibility
        - case-21-fire-design-drafts
        - case-22-inventory-advertising
        - case-23-equipment-rental
        - case-24-distributor-data
    validations:
      required: true
  - type: input
    id: learner
    attributes:
      label: 学习者标识
      description: "稳定的小写英文或数字标识，可含横线、下划线；跨会话沿用。"
      placeholder: "例如 li-ming"
    validations:
      required: true
  - type: input
    id: display_name
    attributes:
      label: 昵称
      placeholder: "你的公开昵称"
    validations:
      required: true
  - type: textarea
    id: reflection
    attributes:
      label: 思考、评价或问题
      description: "可直接粘贴Agent整理的内容。请分清你的表达与Agent建议，附上案例或原记录链接。"
    validations:
      required: true
