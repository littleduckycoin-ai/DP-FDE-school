name: School checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  school-checks:
    name: school-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test skill and Feishu adapter
        run: node --test tests/*.mjs
      - name: Verify complete Skills CLI installation
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          cd "$(mktemp -d)"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill school-guide -a codex -y --copy
          diff -r "$GITHUB_WORKSPACE/skills/school-guide" .agents/skills/school-guide
          node .agents/skills/school-guide/scripts/feishu_school.mjs --help
