name: School checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  school-checks:
    name: school-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate school materials
        run: python tools/validate.py
      - name: Preserve existing learner history
        if: github.event_name == 'pull_request'
        env:
          SCHOOL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/validate.py --base-ref "$SCHOOL_BASE_SHA"
      - name: Test recording and meeting workflows
        run: python -m unittest discover -s tests -v
